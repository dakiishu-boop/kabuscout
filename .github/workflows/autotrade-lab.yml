# 自動売買ツール（autotrade/）の研究用。作業ブランチへの push で動く。
# 本番のデータ（キャッシュ）は「読むだけ」。本番のキャッシュ・バックアップ・Discord・Webページには一切書き込まない。
# キャッシュは保存しない（リポジトリ全体の上限10GBを超えると、本番のデータのキャッシュが消されて毎日の実行が止まるため）。
name: autotrade-lab

on:
  push:
    branches: ["claude/**"]
    paths: ["autotrade/**", ".github/workflows/autotrade-lab.yml"]
  workflow_dispatch:

concurrency: autotrade-lab-${{ github.ref }}

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # 本番のデータ（株価25年分など）を読むだけで戻す。保存（save）はしない
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: kabuscout-data-none
          restore-keys: kabuscout-data-
      - name: Lab
        env:
          PYTHONWARNINGS: ignore
          # J-Quants のキーは、公式の始値との比較（autotrade/opencheck.py、2026-11-27 に1回）のときだけ使った。
          # 普段は渡さない。もう一度比べるときは、ここに JQUANTS_API_KEY（リポジトリの Secrets）を足す
        run: bash -e autotrade/LAB_CMD  # 実行する研究の内容（1行に1つのコマンド）
