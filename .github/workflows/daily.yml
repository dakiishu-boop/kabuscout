# パソコンが閉じていても毎営業日の引け後にクラウド(GitHub Actions)でスクリーニング
# → Discord / ntfy に通知し、結果を GitHub Pages のWebページに公開する
# Secrets: DISCORD_WEBHOOK_URL / NTFY_TOPIC（どちらか片方でも可）
name: daily-screening

on:
  schedule:
    # 15:53 JST。GitHub の定時実行は混む時刻（毎時0分・30分・45分など）に大きく遅れやすい（2026-10-22 は45分遅れ）ので、
    # 空いていそうな時刻にする。Yahooのデータの確定（15:55頃）までは自動で待つ
    - cron: "53 6 * * 1-5"
    # 予備（2026-11-24 に GitHub が定時実行を丸ごと飛ばした）: 18:23 と 20:43 JST にもう一度起動する。
    # その日の 15:30 以降に成功した実行があれば、下の check ジョブが何もせずに終わる（二重の実行・通知はしない）
    - cron: "23 9 * * 1-5"
    - cron: "43 11 * * 1-5"
  workflow_dispatch:
    inputs:
      args:
        description: "追加オプション（例: --force --retrain）"
        required: false
        default: ""
      restore_from_backup:
        description: "キャッシュが消えたときだけ: バックアップ（private リポジトリ）から取り直せないデータを戻して実行（docs/RESTORE.md）"
        type: boolean
        default: false
      backup_branch:
        description: "戻すバックアップ（latest / daily-mon〜fri / weekly-0〜3 / monthly-01〜12）"
        required: false
        default: "latest"
      simulate_backup_failure:
        description: "試験用: バックアップをわざと失敗させる（失敗してもWebの公開とリマインダーが動くかの確認）"
        type: boolean
        default: false

concurrency: kabuscout-data

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 定時実行のときだけ: 今日（日本時間）の 15:30 以降に、この処理がもう成功していたら残りを飛ばす。
  # concurrency で前の実行が終わるまで待ってから確かめるので、本番の実行と予備が同時に走ることはない。手動の実行はいつも動く
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.done.outputs.skip }}
    steps:
      - id: done
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d "TZ=\"Asia/Tokyo\" $(TZ=Asia/Tokyo date +%F) 15:30" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/daily.yml/runs?status=success&created=>=${since}&per_page=50" \
                --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length')
          echo "今日 ${since} 以降に成功した実行: ${n} 回"
          if [ "${n}" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  screen:
    needs: check
    if: ${{ needs.check.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    env:
      HAS_BACKUP_KEY: ${{ secrets.BACKUP_DEPLOY_KEY != '' }}   # バックアップ用の鍵が登録されているか（docs/RESTORE.md）
    outputs:
      shadow_due: ${{ steps.shadow_due.outputs.due }}
      pages: ${{ steps.pages.outputs.ready }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # 株価DB・モデル・成績をキャッシュで引き継ぐ（毎日使われる限り消えない）
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: data
          key: kabuscout-data-${{ github.run_id }}
          restore-keys: kabuscout-data-
          # キャッシュが無い日は空から作り直さずに失敗させる（取り直せないデータを空で上書きしないため）。
          # 本当に消えたときは restore_from_backup で実行して、バックアップから戻す（docs/RESTORE.md。キャッシュがある日は戻さない）
          fail-on-cache-miss: ${{ github.event.inputs.restore_from_backup != 'true' }}

      - name: Check out backup (restore only)
        if: github.event.inputs.restore_from_backup == 'true' && steps.cache.outputs.cache-matched-key == ''
        uses: actions/checkout@v4
        with:
          repository: dakiishu-boop/kabuscout-backup
          ref: ${{ github.event.inputs.backup_branch || 'latest' }}
          path: _backup
          ssh-key: ${{ secrets.BACKUP_DEPLOY_KEY }}
          fetch-depth: 1

      - name: Restore irreplaceable data from backup
        if: github.event.inputs.restore_from_backup == 'true' && steps.cache.outputs.cache-matched-key == ''
        run: python -m kabuscout restore --from _backup && rm -rf _backup

      - name: Run screening
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          PYTHONWARNINGS: ignore
          ARGS: ${{ github.event.inputs.args }}
        run: |
          python -m kabuscout daily $ARGS
          python -m kabuscout site   # 休場日などでスキップした日もページは最新化

      # 自動売買（autotrade）のペーパートレード: 今日の寄付の約定・時価評価・翌朝の注文（docs/AUTOTRADE.md）。
      # 失敗・時間切れでも本番（スクリーニング・キャッシュの保存・Webの公開）は止めない
      - name: Auto-trading (paper account)
        continue-on-error: true
        timeout-minutes: 30
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PYTHONWARNINGS: ignore
        run: python -m autotrade daily

      # 影のモデル（shadow.yaml）の学習し直しが要るか。要る日だけ、下の shadow ジョブで学習する（Webの公開を遅らせないため）
      - name: Check if shadow models need retraining
        id: shadow_due
        continue-on-error: true
        run: python -m kabuscout shadow-due

      # 成功したときだけ保存する（失敗した実行の書きかけのファイルを翌日に引き継がない）
      - uses: actions/cache/save@v4
        with:
          path: data
          key: kabuscout-data-${{ github.run_id }}

      # Webページの公開用ファイルは、バックアップより前に上げる（バックアップが失敗しても公開は止めない。失敗は赤く残る）
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: pages
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      # 取り直せないデータ（DB・需給・決算短信の数値・J-Quants・全候補の記録）を private のリポジトリに控える（kabuscout/backup.py）
      - name: Backup key missing
        if: env.HAS_BACKUP_KEY != 'true'
        run: echo "::warning::BACKUP_DEPLOY_KEY が未登録のため、取り直せないデータのバックアップをしていません（docs/RESTORE.md）"
      - name: Check out backup repository
        if: env.HAS_BACKUP_KEY == 'true'
        uses: actions/checkout@v4
        with:
          repository: dakiishu-boop/kabuscout-backup
          ref: latest
          path: _backup
          ssh-key: ${{ secrets.BACKUP_DEPLOY_KEY }}
          fetch-depth: 1
      - name: Back up irreplaceable data
        if: env.HAS_BACKUP_KEY == 'true'
        run: |
          if [ "${{ github.event.inputs.simulate_backup_failure }}" = "true" ]; then
            echo "::error::試験のためにバックアップをわざと失敗させます"; exit 1
          fi
          python -m kabuscout backup --repo-dir _backup && rm -rf _backup
      - name: Remind to push (scheduled runs stop after 60 days without a push)
        if: always()   # バックアップが失敗した日も知らせる
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m kabuscout remind-push


  # 影のモデルの学習（5営業日に1回ほど・数十分）。Webの公開（deploy）とは並んで動き、終わったらモデル入りの data をキャッシュに保存する
  # （翌日の実行は一番新しいキャッシュ＝これを読む）。失敗しても本番には影響しない（影の点が付かない日ができるだけ）
  shadow:
    needs: screen
    if: ${{ !cancelled() && needs.screen.outputs.shadow_due == 'true' }}   # バックアップが失敗しても動く（キャッシュはその前に保存済み）
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: kabuscout-data-${{ github.run_id }}-shadow
          restore-keys: kabuscout-data-
          fail-on-cache-miss: true
      - name: Train shadow models
        id: train
        env:
          PYTHONWARNINGS: ignore
        run: python -m kabuscout shadow-train
      - uses: actions/cache/save@v4
        if: steps.train.outputs.trained == 'true'
        with:
          path: data
          key: kabuscout-data-${{ github.run_id }}-shadow

  deploy:
    needs: screen
    if: ${{ !cancelled() && needs.screen.outputs.pages == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
