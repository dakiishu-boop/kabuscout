# パソコンが閉じていても毎営業日の引け後にクラウド(GitHub Actions)でスクリーニング
# → Discord / ntfy に通知し、結果を GitHub Pages のWebページに公開する
# Secrets: DISCORD_WEBHOOK_URL / NTFY_TOPIC（どちらか片方でも可）
name: daily-screening

on:
  schedule:
    - cron: "45 6 * * 1-5"   # 15:45 JST。Yahooのデータは約20分遅れなので、確定(15:55頃)まで自動で待ってから実行
  workflow_dispatch:
    inputs:
      args:
        description: "追加オプション（例: --force --retrain）"
        required: false
        default: ""

concurrency: kabuscout-data

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # 株価DB・モデル・成績をキャッシュで引き継ぐ（毎日使われる限り消えない）
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: kabuscout-data-${{ github.run_id }}
          restore-keys: kabuscout-data-

      - name: Run screening
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          PYTHONWARNINGS: ignore
          ARGS: ${{ github.event.inputs.args }}
        run: |
          python -m kabuscout daily $ARGS
          python -m kabuscout site   # 休場日などでスキップした日もページは最新化

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: kabuscout-data-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: screen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
