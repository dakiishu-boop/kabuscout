# パソコンが閉じていても毎営業日の引け後にクラウド(GitHub Actions)でスクリーニング
# → Discord / ntfy に通知し、結果を GitHub Pages のWebページに公開する
# Secrets: DISCORD_WEBHOOK_URL / NTFY_TOPIC（どちらか片方でも可）
name: daily-screening

on:
  schedule:
    # 15:53 JST。GitHub の定時実行は混む時刻（毎時0分・30分・45分など）に大きく遅れやすい（2026-10-22 は45分遅れ）ので、
    # 空いていそうな時刻にする。Yahooのデータの確定（15:55頃）までは自動で待つ
    - cron: "53 6 * * 1-5"
  workflow_dispatch:
    inputs:
      args:
        description: "追加オプション（例: --force --retrain）"
        required: false
        default: ""
      restore_from_backup:
        description: "キャッシュが消えたときだけ: バックアップ（private リポジトリ）から取り直せないデータを戻して実行（docs/RESTORE.md）"
        type: boolean
        default: false
      backup_branch:
        description: "戻すバックアップ（latest / daily-mon〜fri / weekly-0〜3 / monthly-01〜12）"
        required: false
        default: "latest"

concurrency: kabuscout-data

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  screen:
    runs-on: ubuntu-latest
    env:
      HAS_BACKUP_KEY: ${{ secrets.BACKUP_DEPLOY_KEY != '' }}   # バックアップ用の鍵が登録されているか（docs/RESTORE.md）
    outputs:
      shadow_due: ${{ steps.shadow_due.outputs.due }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # 株価DB・モデル・成績をキャッシュで引き継ぐ（毎日使われる限り消えない）
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: data
          key: kabuscout-data-${{ github.run_id }}
          restore-keys: kabuscout-data-
          # キャッシュが無い日は空から作り直さずに失敗させる（取り直せないデータを空で上書きしないため）。
          # 本当に消えたときは restore_from_backup で実行して、バックアップから戻す（docs/RESTORE.md。キャッシュがある日は戻さない）
          fail-on-cache-miss: ${{ github.event.inputs.restore_from_backup != 'true' }}

      - name: Check out backup (restore only)
        if: github.event.inputs.restore_from_backup == 'true' && steps.cache.outputs.cache-matched-key == ''
        uses: actions/checkout@v4
        with:
          repository: dakiishu-boop/kabuscout-backup
          ref: ${{ github.event.inputs.backup_branch || 'latest' }}
          path: _backup
          ssh-key: ${{ secrets.BACKUP_DEPLOY_KEY }}
          fetch-depth: 1

      - name: Restore irreplaceable data from backup
        if: github.event.inputs.restore_from_backup == 'true' && steps.cache.outputs.cache-matched-key == ''
        run: python -m kabuscout restore --from _backup && rm -rf _backup

      - name: Run screening
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          PYTHONWARNINGS: ignore
          ARGS: ${{ github.event.inputs.args }}
        run: |
          python -m kabuscout daily $ARGS
          python -m kabuscout site   # 休場日などでスキップした日もページは最新化

      # 影のモデル（shadow.yaml）の学習し直しが要るか。要る日だけ、下の shadow ジョブで学習する（Webの公開を遅らせないため）
      - name: Check if shadow models need retraining
        id: shadow_due
        continue-on-error: true
        run: python -m kabuscout shadow-due

      # 成功したときだけ保存する（失敗した実行の書きかけのファイルを翌日に引き継がない）
      - uses: actions/cache/save@v4
        with:
          path: data
          key: kabuscout-data-${{ github.run_id }}

      # 取り直せないデータ（DB・需給・決算短信の数値・J-Quants・全候補の記録）を private のリポジトリに控える（kabuscout/backup.py）
      - name: Backup key missing
        if: env.HAS_BACKUP_KEY != 'true'
        run: echo "::warning::BACKUP_DEPLOY_KEY が未登録のため、取り直せないデータのバックアップをしていません（docs/RESTORE.md）"
      - name: Check out backup repository
        if: env.HAS_BACKUP_KEY == 'true'
        uses: actions/checkout@v4
        with:
          repository: dakiishu-boop/kabuscout-backup
          ref: latest
          path: _backup
          ssh-key: ${{ secrets.BACKUP_DEPLOY_KEY }}
          fetch-depth: 1
      - name: Back up irreplaceable data
        if: env.HAS_BACKUP_KEY == 'true'
        run: python -m kabuscout backup --repo-dir _backup && rm -rf _backup
      - name: Remind to push (scheduled runs stop after 60 days without a push)
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m kabuscout remind-push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # 影のモデルの学習（5営業日に1回ほど・数十分）。Webの公開（deploy）とは並んで動き、終わったらモデル入りの data をキャッシュに保存する
  # （翌日の実行は一番新しいキャッシュ＝これを読む）。失敗しても本番には影響しない（影の点が付かない日ができるだけ）
  shadow:
    needs: screen
    if: needs.screen.outputs.shadow_due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: kabuscout-data-${{ github.run_id }}-shadow
          restore-keys: kabuscout-data-
          fail-on-cache-miss: true
      - name: Train shadow models
        id: train
        env:
          PYTHONWARNINGS: ignore
        run: python -m kabuscout shadow-train
      - uses: actions/cache/save@v4
        if: steps.train.outputs.trained == 'true'
        with:
          path: data
          key: kabuscout-data-${{ github.run_id }}-shadow

  deploy:
    needs: screen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
