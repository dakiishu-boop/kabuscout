# 週末の研究ループ: 過去25年のデータで戦略の条件を調整（金庫・多重検定補正つき）→ 再学習
# → 過去でのペーパートレード（ウォークフォワード）→ Webページ更新 → Discord に研究レポート
name: weekly-research

on:
  schedule:
    - cron: "0 0 * * 6"   # 毎週土曜 9:00 JST（研究ループ一式）
    - cron: "0 0 * * 0"   # 毎週日曜 9:00 JST（AIの特徴量・専門モデルの研究。6時間の上限に収めるため土曜と分けた）
  workflow_dispatch:
    inputs:
      command:
        description: "research（研究ループ一式）/ backtest（過去ペーパートレードとWebページの更新だけ）/ edinet（財務データの取得だけ）/ jquants（J-Quants の決算サマリの取得だけ）/ evaluate-jquants（その効果の確認）/ survivorship（生存者バイアスの測定）/ tdnet（適時開示の取得だけ）/ evaluate-edinet（財務データの効果の確認）/ prices（株価・配当・分割の取得だけ）/ tdnet-xbrl（決算短信の数値の取得だけ）/ research-ai（AIの特徴量・専門モデルの研究だけ。毎週日曜）/ flows（信用残・空売り残高・品貸料の取得だけ）"
        required: false
        default: "research"
      args:
        description: "追加オプション（例: --trials 400 --budget-min 120）"
        required: false
        default: ""
      restore_from_backup:
        description: "キャッシュが消えたときだけ: バックアップ（private リポジトリ）から取り直せないデータを戻して実行（docs/RESTORE.md。command は prices）"
        type: boolean
        default: false
      backup_branch:
        description: "戻すバックアップ（latest / daily-mon〜fri / weekly-0〜3 / monthly-01〜12）"
        required: false
        default: "latest"

concurrency: kabuscout-data

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  research:
    runs-on: ubuntu-latest
    env:
      HAS_BACKUP_KEY: ${{ secrets.BACKUP_DEPLOY_KEY != '' }}   # バックアップ用の鍵が登録されているか（docs/RESTORE.md）
    outputs:
      pages: ${{ steps.pages.outputs.ready }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: data
          key: kabuscout-data-${{ github.run_id }}
          restore-keys: kabuscout-data-
          # キャッシュが無い日は空から作り直さずに失敗させる（取り直せないデータを空で上書きしないため）。
          # 本当に消えたときは restore_from_backup で実行して、バックアップから戻す（docs/RESTORE.md。キャッシュがある日は戻さない）
          fail-on-cache-miss: ${{ github.event.inputs.restore_from_backup != 'true' }}

      - name: Check out backup (restore only)
        if: github.event.inputs.restore_from_backup == 'true' && steps.cache.outputs.cache-matched-key == ''
        uses: actions/checkout@v4
        with:
          repository: dakiishu-boop/kabuscout-backup
          ref: ${{ github.event.inputs.backup_branch || 'latest' }}
          path: _backup
          ssh-key: ${{ secrets.BACKUP_DEPLOY_KEY }}
          fetch-depth: 1

      - name: Restore irreplaceable data from backup
        if: github.event.inputs.restore_from_backup == 'true' && steps.cache.outputs.cache-matched-key == ''
        run: python -m kabuscout restore --from _backup && rm -rf _backup
      - name: Research
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          PYTHONWARNINGS: ignore
          ARGS: ${{ github.event.inputs.args }}
          COMMAND: ${{ github.event.inputs.command || (github.event.schedule == '0 0 * * 0' && 'research-ai') || 'research' }}
        run: python -m kabuscout "$COMMAND" $ARGS
      # 成功したときだけ保存する（失敗した実行の書きかけのファイルを翌日に引き継がない）
      - uses: actions/cache/save@v4
        with:
          path: data
          key: kabuscout-data-${{ github.run_id }}

      # Webページの公開用ファイルは、バックアップより前に上げる（バックアップが失敗しても公開は止めない。失敗は赤く残る）
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: pages
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      # 取り直せないデータ（DB・需給・決算短信の数値・J-Quants・全候補の記録）を private のリポジトリに控える（kabuscout/backup.py）
      - name: Backup key missing
        if: env.HAS_BACKUP_KEY != 'true'
        run: echo "::warning::BACKUP_DEPLOY_KEY が未登録のため、取り直せないデータのバックアップをしていません（docs/RESTORE.md）"
      - name: Check out backup repository
        if: env.HAS_BACKUP_KEY == 'true'
        uses: actions/checkout@v4
        with:
          repository: dakiishu-boop/kabuscout-backup
          ref: latest
          path: _backup
          ssh-key: ${{ secrets.BACKUP_DEPLOY_KEY }}
          fetch-depth: 1
      - name: Back up irreplaceable data
        if: env.HAS_BACKUP_KEY == 'true'
        run: python -m kabuscout backup --repo-dir _backup && rm -rf _backup

  deploy:
    needs: research
    if: ${{ !cancelled() && needs.research.outputs.pages == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
