# 週末の研究ループ: 過去25年のデータで戦略の条件を調整（金庫・多重検定補正つき）→ 再学習
# → 過去でのペーパートレード（ウォークフォワード）→ Webページ更新 → Discord に研究レポート
name: weekly-research

on:
  schedule:
    - cron: "0 0 * * 6"   # 毎週土曜 9:00 JST（研究ループ一式）
    - cron: "0 0 * * 0"   # 毎週日曜 9:00 JST（AIの特徴量・専門モデルの研究。6時間の上限に収めるため土曜と分けた）
  workflow_dispatch:
    inputs:
      command:
        description: "research（研究ループ一式）/ backtest（過去ペーパートレードとWebページの更新だけ）/ edinet（財務データの取得だけ）/ jquants（J-Quants の決算サマリの取得だけ）/ evaluate-jquants（その効果の確認）/ survivorship（生存者バイアスの測定）/ tdnet（適時開示の取得だけ）/ evaluate-edinet（財務データの効果の確認）/ prices（株価・配当・分割の取得だけ）/ tdnet-xbrl（決算短信の数値の取得だけ）/ research-ai（AIの特徴量・専門モデルの研究だけ。毎週日曜）"
        required: false
        default: "research"
      args:
        description: "追加オプション（例: --trials 400 --budget-min 120）"
        required: false
        default: ""

concurrency: kabuscout-data

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: kabuscout-data-${{ github.run_id }}
          restore-keys: kabuscout-data-
      - name: Research
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          PYTHONWARNINGS: ignore
          ARGS: ${{ github.event.inputs.args }}
          COMMAND: ${{ github.event.inputs.command || (github.event.schedule == '0 0 * * 0' && 'research-ai') || 'research' }}
        run: python -m kabuscout "$COMMAND" $ARGS
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: kabuscout-data-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: research
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
