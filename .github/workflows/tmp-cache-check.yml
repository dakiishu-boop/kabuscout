# 一時的な確認用（マージ前に消す）: cache/restore@v5 が、v4 で保存した本番のデータのキャッシュを見つけられるか。読むだけ・保存しない・中身も取らない。
name: tmp-cache-check
on:
  push:
    branches: ["chore/actions-node24"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/cache/restore@v5
        id: cache
        with:
          path: data
          key: kabuscout-data-${{ github.run_id }}
          restore-keys: kabuscout-data-
          lookup-only: true
          fail-on-cache-miss: true
      - run: echo "見つかったキャッシュ = ${{ steps.cache.outputs.cache-matched-key }}"
