# 自動売買（autotrade）の設定。kabuscout の config.yaml（データの置き場所・通知）はそのまま使う。
# 値は research（2008〜2018年の設計期間）で選んだもの。docs/AUTOTRADE.md に根拠を書く。
account:
  capital: 1000000        # kabuscout の比較と同じ100万円
strategy:
  n_hold: 5               # 同時に持つ銘柄数
  rebalance_every: 5      # 何営業日ごとに入れ替えるか
  keep_rank: 30           # 持っている銘柄は、この順位以内なら持ち続ける
  depth: 25               # 新規に買う候補を何位まで見るか
  stop_loss: 0.0          # 損切は使わない（研究では成績が下がった）
  regime_ma: 75           # 日経平均が75日線を下回ったら…
  regime_scale: 0.5       # …持つ数を半分にする（5 × 0.5 = 2.5 → Python の丸めで2銘柄）
  lot: 100
  cost: 0.002
# 比較用の口座（売買の形だけが違う仮想の口座。本番の口座と同じAIの点数で並べて動かし、前向きのデータでどちらが良いかを決める）
# daily: 毎日入れ替え・50位以内は持ち続ける。過去の検証では年率が高いが、売買が2倍で、コスト0.5%では本番の形に負けた（docs/AUTOTRADE.md）
shadow_accounts:
  daily: {rebalance_every: 1, keep_rank: 50}
model:
  horizons: [5]           # 5営業日後の順位を学習する（設計期間で20営業日・両方の平均より良かった）
  seeds: 1
  sample_every: 3
risk:                     # 注文直前の安全装置（autotrade/risk.py）
  max_order_value: 400000
  max_order_frac: 0.35
  max_price_move: 0.3
  max_orders_per_day: 20
  kill_drawdown: 0.35
  data_max_age_days: 3
