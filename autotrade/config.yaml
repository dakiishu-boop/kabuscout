# 自動売買（autotrade）の設定。kabuscout の config.yaml（データの置き場所・通知）はそのまま使う。
# 値は research（2008〜2018年の設計期間）で選んだもの。docs/AUTOTRADE.md に根拠を書く。
account:
  capital: 1000000        # kabuscout の比較と同じ100万円
strategy:
  n_hold: 5               # 同時に持つ銘柄数
  rebalance_every: 5      # 何営業日ごとに入れ替えるか
  keep_rank: 30           # 持っている銘柄は、この順位以内なら持ち続ける
  depth: 25               # 新規に買う候補を何位まで見るか
  stop_loss: 0.0          # 損切は使わない（研究では成績が下がった）
  # 弱い相場（日経平均が75日線の下）では持つ数を5 → 4銘柄にする（2026-11-28 にユーザーの選択「下落は深くないほうがいいが、利益は大きく出したい」）。
  # リスクの好みの選択で、腕が上がったわけではない（docs/RESEARCH_RULES.md の 2）。同じ回の比較（ジャーナル §102）で、100万円・2019年〜・コスト0.5%＋不成立日なし:
  # 2銘柄 +11.1%・−25.7% / 3銘柄 +12.5%・−28.5% / 4銘柄 +15.3%・−31.2% / 5銘柄 +17.4%・−40.3%。2008年〜の最悪の種の最大下落は 4銘柄 −47.9%（5銘柄 −55.5%）
  # round(5 × 0.8) = 4。前の設定（減らさない）は比較用の口座 weak5 で並走させる
  regime_ma: 75
  regime_scale: 0.8
  lot: 100
  cost: 0.002
  # AI の部分の利益に毎年初めに税をかける（特定口座を想定・損失は3年繰り越し）。指数の部分は NISA で非課税とみなす。
  # 過去の検証の判定（税引き後）と前向きの記録を揃えるため。配当も受け取る（税引き後）
  tax_ai: 0.20315
# 比較用の口座（売買の形だけが違う仮想の口座。本番の口座と同じAIの点数で並べて動かし、前向きのデータでどちらが良いかを決める）
# 値は本番の strategy への差分。risk は口座ごとの安全装置（過去の検証の最悪の最大下落 + 10ポイント）
# frozen: 2026-11-26 に凍結した版（弱い相場では2銘柄に減らす）。過去の検証の最悪の最大下落 −40.4%
# daily: 毎日入れ替え・50位以内は持ち続ける（凍結した版がもと）。年率は高いが売買が2倍で、コスト0.5%では凍結した版に負けた
shadow_accounts:
  frozen: {regime_ma: 75, regime_scale: 0.5, risk: {kill_drawdown: 0.50}}
  # weak5: 2026-11-26〜28 の本番の設定（弱い相場でも減らさない）。最悪の種の最大下落 −55.5%（§102）+ 10ポイント
  weak5: {regime_ma: 0, regime_scale: 1.0, risk: {kill_drawdown: 0.65}}
  daily: {rebalance_every: 1, keep_rank: 50, regime_ma: 75, regime_scale: 0.5, risk: {kill_drawdown: 0.65}}
  # AIと指数を組み合わせた口座（autotrade/blend.py）: 資金の半分を指数、半分を本番の形のAI。毎年初めに比率を戻す。
  # 2026-11-27 の検証で「指数だけ」より良いとは言えなかった（docs/AUTOTRADE.md）。前向きの記録のために並走させる
  blend_sp500: {index_share: 0.5, index_name: "S&P500", risk: {kill_drawdown: 0.59}}
  blend_acwi: {index_share: 0.5, index_name: "全世界株式（オルカン）", risk: {kill_drawdown: 0.61}}
  # 比べる相手: 指数だけ（AI は使わない）
  index_sp500: {index_share: 1.0, index_name: "S&P500"}
  index_acwi: {index_share: 1.0, index_name: "全世界株式（オルカン）"}
model:
  horizons: [5]           # 5営業日後の順位を学習する（設計期間で20営業日・両方の平均より良かった）
  seeds: 1
  sample_every: 3
risk:                     # 注文直前の安全装置（autotrade/risk.py）
  max_order_value: 400000
  max_order_frac: 0.35
  max_price_move: 0.3
  max_orders_per_day: 20
  # 最高値からこれだけ下がったら新規の買いを止める（売りは通す・人が戻すまで止まる）。
  # 過去の検証の最悪の最大下落（弱い相場で4銘柄: −47.9%、§102）+ 10ポイント。過去の範囲の下げでは止まらず、それを超える想定外の下げで止まる
  kill_drawdown: 0.58
  data_max_age_days: 3
