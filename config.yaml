# KabuScout 設定ファイル
# ${ENV_VAR} 形式で環境変数を参照できます（.env ファイルにも書けます）

universe:
  # 対象市場（JPXの「市場・商品区分」に部分一致）
  markets: ["プライム", "スタンダード", "グロース"]
  # 流動性フィルタ：20日平均売買代金（円）
  min_turnover_jpy: 100000000
  min_price: 100
  # 地合い判定・危機の自動検知に使う指数（Yahoo の TOPIX連動ETF は2009年以降しかなく分割の調整漏れもあるため日経平均）
  market_proxy: "^N225"
  refresh_days: 7

data:
  db_path: data/kabuscout.db
  price_dir: data/prices
  pool_path: data/pool.parquet
  model_dir: data/models
  report_dir: reports
  # 株価履歴の開始日（約25年分）
  history_start: "2002-01-01"
  batch_size: 100

labeling:
  # トリプルバリア法：エントリー（翌日寄付き）から horizon 営業日以内に
  # 利確ライン（+tp_atr × ATR）に先に到達したら「勝ち」
  horizon_days: 10
  tp_atr: 2.0
  sl_atr: 1.0
  # 損切の出し方: intraday = 場中の逆指値（既定・1ティック不利に約定） / close = 終値で割ったら翌日の寄付で売る。
  # close は過去の検証で年率が約5ポイント高い一方、最大下落が深い（ジャーナル ラウンド9）。リスクの好みで選ぶ
  stop_mode: intraday

screening:
  top_n: 15
  # 決算予定日を調べる上位銘柄数（Yahoo に1銘柄ずつ問い合わせるため少なめに）
  earnings_check_n: 15

learning:
  # 何営業日ごとに再学習するか
  retrain_every_days: 5
  # 学習データの新しさ重み（半減期・日）。25年分あるので5年で半分
  recency_half_life_days: 1825
  # 危機局面（リーマン・コロナ等の特例期間）のデータの重み。捨てずに参考程度に扱う
  crisis_weight: 0.3
  # 学習に使わず成績確認に回す直近の割合（25年の15% ≒ 直近3〜4年）
  holdout_fraction: 0.15
  min_train_samples: 2000
  # 本番のAIは乱数の種を変えた複数のモデルの平均にする（予測の「くじ運」を減らす。年ごとの成績のぶれが約3割小さくなった）
  # 研究ループの比較は時間の都合で1つのまま
  seeds: 3

paper_trading:
  enabled: true
  # 実用段階で使う予定の資金（100万円）に合わせる。株数は100株単位、1銘柄は「資金 ÷ 同時保有数」まで
  capital_jpy: 1000000
  # 損切になったときの損失を資金のこの割合までに抑える（kabuscout/risk.py・ジャーナル ラウンド8）
  risk_per_trade: 0.02
  # 含み損込みの資金が最高値からこれ以上減ったら、通知とWebページで「運用を止めて見直す目安」を出す
  # （過去ペーパートレードの最大下落 約−27% を大きく超える＝想定外の状態）
  stop_review_dd: 0.35
  max_positions: 5
  # 毎日、順位の高い順に最大何銘柄を新規で買うか
  picks_per_day: 2
  # AI勝率予測の下限（0 なら順位だけで選ぶ）
  min_prob: 0
  lot_size: 100

notify:
  discord_webhook: ${DISCORD_WEBHOOK_URL}
  ntfy_topic: ${NTFY_TOPIC}
  ntfy_server: https://ntfy.sh
  macos: true

earnings:
  # 1回の実行で決算情報の取得に使う最大の時間（分）。通知の後に実行。初回の全銘柄取得は約40分で、2回に分けて進む
  max_minutes: 30

schedule:
  # 引け直後に起動された場合、当日の株価が確定するまで待つ
  wait_for_data: true
  max_wait_min: 45

jquants:
  # Free プランは1分あたり5回まで。過去約2年分を開示日ごとに取得する
  requests_per_min: 5
  history_days: 760
  # 開示から手元で使えるようになるまでの日数（Free は約12週遅れ）。研究でも同じだけ遅らせて本番と揃える
  lag_days: 84

site:
  url: https://dakiishu-boop.github.io/kabuscout/

research:
  # 1往復あたりの取引コスト（手数料・売買の気配差・滑り）。成績から差し引いて評価する
  cost: 0.002
  # 直近この営業日数は「金庫」。研究中は見ず、最後の確認にだけ使う
  vault_days: 120
  vault_min_trades: 20
  # 金庫を開けるたびに上乗せする合格ライン（1回あたり）
  vault_margin: 0.0005
  trials_per_strategy: 200
  budget_min: 60
  # 年ごとの採点に使う最低取引数・最低年数
  min_trades_per_year: 20
  min_years: 8
  # 「実用水準」とみなす、平常時の年のうちプラスの年の割合（候補は現行より下がらないことも必須）
  min_positive_years: 0.6
  # 危機局面での成績が現行よりこれ以上悪化する条件は採用しない
  crisis_tolerance: 0.005
  # 有意水準（累計の試行回数で割る = Bonferroni 補正）
  alpha: 0.05
  # AIのモデル設定・特徴量の比較の合格ラインの下限（乱数の種だけを変えても t≈2 が出るため）
  min_t_model: 2.5
  # AIのモデル設定・特徴量の比較は、乱数の種を変えたこの数のウォークフォワードの平均で行う
  compare_seeds: 2
  # 売買ルールの探索範囲（利確・損切はATRの何倍か、最長保有日数）
  plan_grid:
    tp_atr: [1.0, 1.5, 2.0, 2.5, 3.0, 4.0, 6.0, 8.0]
    sl_atr: [0.75, 1.0, 1.5, 2.0, 3.0]
    horizon_days: [5, 10, 15, 20, 30, 40, 60]
  # 売買ルールの比較は「1枠あたりの年率換算」。金庫を開けるたびの上乗せ・危機時の許容悪化幅も年率で
  plan_vault_margin: 0.01
  plan_crisis_tolerance: 0.05
  # 地合いによる買い控えの候補（日経平均の75日線乖離・20日騰落・危機局面）。max_new = その日に新規で買う上限
  gate_candidates:
    - {name: "日経平均が75日線割れなら新規停止", dev75: 0.0, max_new: 0}
    - {name: "日経平均が75日線割れなら新規1銘柄", dev75: 0.0, max_new: 1}
    - {name: "日経平均が75日線を5%下回ったら新規停止", dev75: -0.05, max_new: 0}
    - {name: "日経平均が20日で5%以上下落中は新規停止", ret20: -0.05, max_new: 0}
    - {name: "危機局面は新規停止", crisis: true, max_new: 0}
  # 同時保有数・1日の新規数の候補
  portfolio_grid:
    max_positions: [3, 5, 8, 10, 15]
    picks_per_day: [1, 2, 3]
    # 同じ業種（東証33業種）を何銘柄まで持つか（0 = 制限なし）
    max_per_sector: [0, 1, 2]

backtest:
  start_year: 2008
