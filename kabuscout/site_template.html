<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>KabuScout</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface2: #f0f2f5; --text: #1b1f24; --muted: #6a737d;
  --border: #e3e6ea; --up: #d23f3f; --down: #2f6bd1; --accent: #6b4fd8; --warn: #b8740a;
  --good-bg: #fdecec; --bad-bg: #eaf1fd; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --surface: #171b21; --surface2: #1f242c; --text: #e6e9ed; --muted: #8b949e;
    --border: #2a3039; --up: #f06464; --down: #5b93f0; --accent: #9b85f5; --warn: #e0a33a;
    --good-bg: #3a1d1f; --bad-bg: #1a2740; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --surface: #171b21; --surface2: #1f242c; --text: #e6e9ed; --muted: #8b949e;
  --border: #2a3039; --up: #f06464; --down: #5b93f0; --accent: #9b85f5; --warn: #e0a33a;
  --good-bg: #3a1d1f; --bad-bg: #1a2740; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  -webkit-text-size-adjust: 100%; }
a { color: inherit; }
header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 12px 0 6px; }
.brand { font-weight: 700; font-size: 18px; letter-spacing: .01em; white-space: nowrap; }
.brand span { color: var(--muted); font-weight: 500; font-size: 13px; margin-left: 8px; }
.gen { color: var(--muted); font-size: 12px; white-space: nowrap; }
nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav button { appearance: none; border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px;
  padding: 8px 12px 10px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
nav button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
main { padding: 16px 0 48px; }
section[hidden] { display: none; }
h2 { font-size: 16px; margin: 24px 0 10px; }
h2:first-child { margin-top: 4px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border-radius: 12px;
  overflow: hidden; border: 1px solid var(--border); }
.strip > div { background: var(--surface); padding: 10px 12px; }
.strip .k { font-size: 12px; color: var(--muted); }
.strip .v { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .strip { grid-template-columns: repeat(2, 1fr); } }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
.mood-強気 { background: var(--good-bg); color: var(--up); }
.mood-弱気 { background: var(--bad-bg); color: var(--down); }
.mood-中立 { background: var(--surface2); color: var(--warn); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
@media (max-width: 380px) { .grid { grid-template-columns: 1fr; } }
.pick { padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pick-head { display: flex; align-items: center; gap: 10px; }
.rank { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-weight: 700;
  font-size: 14px; background: var(--surface2); }
.rank.r1 { background: #f5c542; color: #4a3500; } .rank.r2 { background: #c9ced6; color: #2a2f36; } .rank.r3 { background: #d9a273; color: #3f2208; }
.pname { min-width: 0; flex: 1; }
.pname b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pname .code { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.prob { text-align: right; flex: none; }
.prob .v { font-weight: 700; font-size: 17px; color: var(--accent); line-height: 1.1; }
.prob .k { font-size: 11px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 6px; background: var(--surface2); color: var(--text); }
.chip.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); font-weight: 600; }
.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-variant-numeric: tabular-nums; }
.levels div { background: var(--surface2); border-radius: 8px; padding: 4px 8px; }
.levels .k { font-size: 11px; color: var(--muted); }
.levels .v { font-weight: 650; }
.up { color: var(--up); } .down { color: var(--down); }
.reasons { font-size: 12.5px; color: var(--muted); }
svg.chart { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 10px; font-size: 11px; color: var(--muted); margin-top: -2px; }
.legend span[style]::before { content: ""; display: inline-block; width: 10px; height: 2px; background: var(--c); vertical-align: middle; margin-right: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 8px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; }
.tbl { overflow-x: auto; }
@media (max-width: 560px) { .hide-sm { display: none; } }
details { margin-bottom: 8px; }
details > summary { list-style: none; cursor: pointer; padding: 10px 14px; display: flex; align-items: center; gap: 10px;
  flex-wrap: wrap; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "›"; color: var(--muted); transition: transform .15s; font-size: 18px; line-height: 1; }
details[open] > summary::before { transform: rotate(90deg); }
details .tbl { padding: 0 6px 8px; }
.res-win { color: var(--up); font-weight: 600; } .res-lose { color: var(--down); font-weight: 600; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.kpi { padding: 12px 14px; }
.kpi .k { font-size: 12px; color: var(--muted); }
.kpi .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--muted); }
@media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
.pad { padding: 12px 14px; }
.bar { height: 8px; border-radius: 4px; background: var(--accent); }
.barrow { display: grid; grid-template-columns: 9.5em 1fr 3.5em; gap: 8px; align-items: center; font-size: 13px; padding: 3px 0; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); margin-top: 24px; }
.banner { margin: 12px 0 0; padding: 10px 14px; border-radius: 10px; font-size: 13.5px; line-height: 1.55;
  background: color-mix(in srgb, var(--up) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--up) 35%, transparent); }
.seg { display: inline-flex; background: var(--surface2); border-radius: 10px; padding: 3px; gap: 2px; margin-bottom: 14px; }
.seg button { appearance: none; border: 0; background: none; font: inherit; font-size: 13.5px; padding: 6px 12px; border-radius: 8px;
  color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
.lg { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.lg i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.evchip { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 5px; margin: 1px 2px 1px 0;
  background: color-mix(in srgb, var(--up) 12%, transparent); color: var(--up); white-space: nowrap; }
.caveat { font-size: 12.5px; color: var(--muted); background: var(--surface2); border-radius: 10px; padding: 10px 14px; margin-top: 12px; }
.caveat li { margin: 2px 0; }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 6.5em 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.timeline li:last-child { border-bottom: 0; }
.toggle { appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 8px;
  font: inherit; font-size: 12px; padding: 2px 8px; cursor: pointer; margin-left: 8px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">📈 KabuScout<span id="hdr-date"></span></div>
      <div class="gen"><span id="gen"></span><button class="toggle" id="theme" aria-label="表示テーマを切り替え">◐</button></div>
    </div>
    <nav role="tablist">
      <button role="tab" data-tab="today" aria-selected="true">今日の候補</button>
      <button role="tab" data-tab="history" aria-selected="false">答え合わせ</button>
      <button role="tab" data-tab="paper" aria-selected="false">ペーパートレード</button>
      <button role="tab" data-tab="ai" aria-selected="false">AI</button>
    </nav>
  </div>
</header>
<main class="wrap">
  <section id="today"></section>
  <section id="history" hidden></section>
  <section id="paper" hidden></section>
  <section id="ai" hidden></section>
  <p class="note">※ 本ページはスクリーニング結果の記録であり、投資助言ではありません。売買の判断はご自身で行ってください。データ: JPX / Yahoo Finance</p>
</main>
<script>
const DATA = /*__DATA__*/null;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen = v => v == null ? "-" : Math.round(v).toLocaleString("ja-JP");
const sgnYen = v => v == null ? "-" : (v > 0 ? "+" : "") + Math.round(v).toLocaleString("ja-JP") + "円";
const pct = (v, d = 1) => v == null ? "-" : (v > 0 ? "+" : "") + (v * 100).toFixed(d) + "%";
const pct0 = v => v == null ? "-" : Math.round(v * 100) + "%";
const cls = v => v > 0 ? "up" : v < 0 ? "down" : "";
const yahoo = c => `https://finance.yahoo.co.jp/quote/${encodeURIComponent(c)}.T`;
const stratName = k => (DATA.strategies[k] || {name: k}).name;
const WD = "日月火水木金土";
const dLabel = s => { const d = new Date(s + "T00:00:00+09:00"); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };
const FEAT = {
  dev5: "5日線乖離", dev25: "25日線乖離", dev75: "75日線乖離", dev200: "200日線乖離", slope25: "25日線の傾き",
  slope75: "75日線の傾き", slope200: "200日線の傾き", ret1: "前日比", ret5: "5日騰落", ret20: "20日騰落",
  ret60: "60日騰落", ret120: "120日騰落", rsi14: "RSI(14)", rsi3: "RSI(3)", stoch_k: "ストキャス", macd_hist: "MACD",
  atr_pct: "値動きの大きさ", bb_pos: "ボリンジャー位置", bbw: "BB幅", bbw_rank: "BB幅の順位", vol_ratio: "出来高倍率",
  vol5_20: "出来高の細り", turnover_log: "売買代金", price_log: "株価水準", dist_high52: "52週高値からの距離",
  dist_low52: "52週安値からの距離", pullback20: "20日高値からの下落", rebound5: "5日安値からの戻り",
  down_streak: "連続下落日数", body: "ローソク実体", lower_shadow: "下ヒゲ", upper_shadow: "上ヒゲ", close_pos: "引け位置",
  gap: "窓", rs20: "対日経平均(20日)", rs60: "対日経平均(60日)", rs_sector20: "業種内の強さ", n_strat: "重なった戦略数",
};
const featName = k => k.startsWith("s_") ? "戦略: " + stratName(k.slice(2)) : (FEAT[k] || k);

// ---------------------------------------------------------------- chart
function chart(code, lv = {}) {
  const p = DATA.prices[code];
  if (!p) return "";
  const n = Math.min(p.date.length, 90), s = p.date.length - n;
  const W = 320, H = 170, padR = 34, padT = 6, padB = 14, cw = (W - padR) / n;
  const sl = a => a.slice(s);
  const hi = sl(p.high), lo = sl(p.low), op = sl(p.open), cl = sl(p.close), m25 = sl(p.ma25), m75 = sl(p.ma75);
  const vals = [...hi, ...lo, ...[lv.tp, lv.sl, lv.entry].filter(v => v != null)];
  let mx = Math.max(...vals), mn = Math.min(...vals); const r = mx - mn || 1; mx += r * .04; mn -= r * .04;
  const y = v => padT + (mx - v) / (mx - mn) * (H - padT - padB);
  let g = "";
  for (let i = 0; i < n; i++) {
    const x = i * cw + cw / 2, up = cl[i] >= op[i], col = up ? "var(--up)" : "var(--down)";
    g += `<line x1="${x}" x2="${x}" y1="${y(hi[i])}" y2="${y(lo[i])}" stroke="${col}" stroke-width="0.7"/>`;
    const y1 = y(Math.max(op[i], cl[i])), y2 = y(Math.min(op[i], cl[i]));
    g += `<rect x="${x - cw * .35}" y="${y1}" width="${cw * .7}" height="${Math.max(1, y2 - y1)}" fill="${up ? "var(--surface)" : col}" stroke="${col}" stroke-width="0.7"/>`;
  }
  const path = (a, c) => { let d = ""; a.forEach((v, i) => { if (v != null) d += (d ? "L" : "M") + (i * cw + cw / 2).toFixed(1) + "," + y(v).toFixed(1); });
    return d ? `<path d="${d}" fill="none" stroke="${c}" stroke-width="1"/>` : ""; };
  g += path(m25, "#2ca02c") + path(m75, "#ff7f0e");
  const hline = (v, c, t) => v == null ? "" : `<line x1="0" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" stroke="${c}" stroke-dasharray="3 2" stroke-width="0.9"/>` +
    `<text x="${W - padR + 3}" y="${y(v) + 3.5}" font-size="9.5" fill="${c}">${t}</text>`;
  g += hline(lv.tp, "var(--up)", "利確") + hline(lv.sl, "var(--down)", "損切") + hline(lv.entry, "var(--accent)", "買値");
  if (lv.tp == null && lv.entry == null) g += `<text x="${W - padR + 3}" y="${y(cl[n - 1]) + 3.5}" font-size="9.5" fill="var(--muted)">${yen(cl[n - 1])}</text>`;
  const first = p.date[s], last = p.date[p.date.length - 1];
  g += `<text x="0" y="${H - 3}" font-size="9" fill="var(--muted)">${first.slice(5).replace("-", "/")}</text>`;
  g += `<text x="${W - padR}" y="${H - 3}" font-size="9" fill="var(--muted)" text-anchor="end">${last.slice(5).replace("-", "/")}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(code)} の日足チャート（90日）">${g}</svg>` +
    `<div class="legend"><span style="--c:#2ca02c">25日線</span><span style="--c:#ff7f0e">75日線</span><span class="muted">日足90日</span></div>`;
}

function lineChart(points, base) {
  if (points.length < 2) return "";
  const W = 600, H = 180, pad = 8, padR = 70;
  const vs = points.map(p => p[1]).concat([base]);
  let mx = Math.max(...vs), mn = Math.min(...vs); const r = mx - mn || 1; mx += r * .1; mn -= r * .1;
  const x = i => pad + i / (points.length - 1) * (W - pad - padR), y = v => pad + (mx - v) / (mx - mn) * (H - pad * 2 - 14);
  const d = points.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(p[1]).toFixed(1)).join("");
  const lastV = points[points.length - 1][1], col = lastV >= base ? "var(--up)" : "var(--down)";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="評価額の推移">
    <line x1="${pad}" x2="${W - padR}" y1="${y(base)}" y2="${y(base)}" stroke="var(--border)" stroke-dasharray="4 3"/>
    <text x="${W - padR + 4}" y="${y(base) + 4}" font-size="11" fill="var(--muted)">元本</text>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2"/>
    <text x="${W - padR + 4}" y="${y(lastV) + 4}" font-size="11" fill="${col}">${(lastV / 10000).toFixed(1)}万</text>
    <text x="${pad}" y="${H - 2}" font-size="10.5" fill="var(--muted)">${points[0][0]}</text>
    <text x="${W - padR}" y="${H - 2}" font-size="10.5" fill="var(--muted)" text-anchor="end">${points[points.length - 1][0]}</text></svg>`;
}

// ---------------------------------------------------------------- 今日の候補
function renderToday() {
  const el = $("#today"), s = DATA.summaries[0];
  if (!s) { el.innerHTML = `<div class="card empty">まだスクリーニング結果がありません</div>`; return; }
  $("#hdr-date").textContent = s.date_label;
  const m = s.market;
  let h = `<div class="strip">
    <div><div class="k">地合い</div><div class="v"><span class="pill mood-${m.mood}">${m.mood}</span></div></div>
    <div><div class="k">日経平均 75日線乖離</div><div class="v ${cls(m.mkt_dev75)}">${pct(m.mkt_dev75)}</div></div>
    <div><div class="k">25日線より上の銘柄</div><div class="v">${pct0(m.breadth25)}</div></div>
    <div><div class="k">走査 → シグナル</div><div class="v">${s.n_scanned.toLocaleString()}<span class="muted small"> → ${s.n_signals}件</span></div></div>
  </div>`;
  if (s.regime && s.regime.crisis) h += `<div class="banner">⚠️ <b>平常時と違う相場（特例モード）: ${esc(s.regime.event)}</b><br>
    過去の危機局面では値動きの法則が崩れやすく、AIの判断も平常時ほど当てになりません。ペーパートレードの新規買いは1銘柄に絞っています。</div>`;
  h += `<h2>注目銘柄 TOP${s.picks.length}</h2><div class="grid">`;
  for (const p of s.picks) {
    const ew = p.earnings_days != null && p.earnings_days <= 14 ? `<span class="chip warn">⚠ 決算まで${p.earnings_days}日</span>` : "";
    h += `<article class="card pick" id="p-${esc(p.code)}">
      <div class="pick-head">
        <div class="rank ${p.rank <= 3 ? "r" + p.rank : ""}">${p.rank}</div>
        <div class="pname"><b><a href="${yahoo(p.code)}" target="_blank" rel="noopener">${esc(p.name)}</a></b><span class="code">${esc(p.code)}</span></div>
        ${p.prob != null ? `<div class="prob"><div class="v">${pct0(p.prob)}</div><div class="k">AI勝率予測</div></div>` : ""}
      </div>
      <div class="chips">${p.strategies.map(t => `<span class="chip">${esc(t)}</span>`).join("")}${ew}</div>
      ${chart(p.code, {tp: p.tp, sl: p.sl})}
      <div class="levels">
        <div><div class="k">終値</div><div class="v">${yen(p.close)}</div></div>
        <div><div class="k">利確目安</div><div class="v up">${yen(p.tp)} <span class="small">${pct(p.tp / p.close - 1)}</span></div></div>
        <div><div class="k">損切目安</div><div class="v down">${yen(p.sl)} <span class="small">${pct(p.sl / p.close - 1)}</span></div></div>
      </div>
      ${p.horizon ? `<div class="small muted">保有は最長${p.horizon}営業日（期限で手仕舞い）</div>` : ""}
      <div class="reasons">${esc(p.reasons)}</div>
      ${p.flows ? `<div class="reasons">📊 需給: ${esc(p.flows)}</div>` : ""}
    </article>`;
  }
  h += `</div>`;
  if (s.model) h += `<p class="small muted" style="margin-top:14px">🧠 AI: ${esc(s.model.edge)} ／ 利確・損切は ATR（平均的な1日の値幅）の${DATA.config.tp_atr}倍・${DATA.config.sl_atr}倍、最長${DATA.config.horizon}営業日で判定</p>`;
  el.innerHTML = h;
}

// ---------------------------------------------------------------- 過去の候補
function renderHistory() {
  const el = $("#history"), by = {};
  for (const r of DATA.signals) (by[r.date] ||= []).push(r);
  const dates = Object.keys(by).sort().reverse();
  if (!dates.length) { el.innerHTML = `<div class="card empty">まだ記録がありません</div>`; return; }
  const sumBy = Object.fromEntries(DATA.summaries.map(s => [s.date, s]));

function logChart(series, shades) {
  const W = 640, H = 240, pL = 6, pR = 54, pT = 8, pB = 18;
  const all = series.flatMap(s => s.points.map(p => p[1])).filter(v => v > 0);
  let mx = Math.log(Math.max(...all)), mn = Math.log(Math.min(...all)); const r = mx - mn || 1; mx += r * .05; mn -= r * .05;
  const t0 = Date.parse(series[0].points[0][0]), t1 = Date.parse(series[0].points[series[0].points.length - 1][0]);
  const x = d => pL + (Date.parse(d) - t0) / (t1 - t0) * (W - pL - pR), y = v => pT + (mx - Math.log(v)) / (mx - mn) * (H - pT - pB);
  let g = "";
  for (const sh of shades) {
    const a = Math.max(Date.parse(sh.start), t0), b = Math.min(Date.parse(sh.end), t1);
    if (b <= a) continue;
    g += `<rect x="${x(new Date(a).toISOString().slice(0, 10))}" y="${pT}" width="${Math.max(1.5, (b - a) / (t1 - t0) * (W - pL - pR))}" height="${H - pT - pB}" fill="var(--up)" opacity=".1"><title>${esc(sh.name)}</title></rect>`;
  }
  for (const v of [2e5, 5e5, 1e6, 2e6, 3e6, 5e6, 1e7, 2e7, 3e7, 5e7]) if (Math.log(v) > mn && Math.log(v) < mx)
    g += `<line x1="${pL}" x2="${W - pR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${W - pR + 4}" y="${y(v) + 4}" font-size="10.5" fill="var(--muted)">${v / 1e4}万</text>`;
  for (const s of series) {
    const d = s.points.filter(p => p[1] > 0).map((p, i) => (i ? "L" : "M") + x(p[0]).toFixed(1) + "," + y(p[1]).toFixed(1)).join("");
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w || 1.6}"/>`;
  }
  const years = []; for (let yy = new Date(t0).getFullYear() + 1; yy <= new Date(t1).getFullYear(); yy += 3) years.push(yy);
  g += years.map(yy => `<text x="${x(yy + "-01-01")}" y="${H - 4}" font-size="10.5" fill="var(--muted)" text-anchor="middle">${yy}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="過去でのペーパートレードの資産推移（対数目盛）">${g}</svg>`;
}

    if (P) {
      const pl = p => `利確 +${p.tp_atr}ATR ／ 損切 −${p.sl_atr}ATR ／ 最長${p.horizon_days}日`;
      h += `<h2>売買ルールの研究（利確・損切・保有日数）</h2>
        <div class="kpis">
          <div class="card kpi" style="grid-column:span 2"><div class="k">現在のルール</div><div class="v" style="font-size:16px">${pl(P.incumbent)}</div>
            <div class="s">1枠あたり年率換算 <span class="${cls(P.inc_score)}">${pct(P.inc_score)}</span>（平常時の年ごとの中央値・コスト控除後）／ 勝率 ${pct0(P.inc_win)} ／ 平均${(P.inc_days || 0).toFixed(1)}日保有</div></div>
          <div class="card kpi" style="grid-column:span 2"><div class="k">今回の最有力候補</div><div class="v" style="font-size:16px">${P.candidate ? pl(P.candidate) : "-"}</div>
            <div class="s">${P.candidate ? `年率換算 <span class="${cls(P.cand_score)}">${pct(P.cand_score)}</span> ／ ` : ""}${P.adopted ? "✅ " : ""}${esc(P.reason)}</div></div>
        </div>
        <p class="small muted">${P.trials}通り（累計${P.cum_trials}）を試行。保有日数が違うと1回あたりの損益は比べられないため、「損益合計 ÷ 保有日数合計 × 250」の年率換算で比較。
          候補は、年ごとの安定性・多重検定の補正・危機局面での悪化チェック・金庫での最終確認をすべて通った場合だけ採用されます。</p>
        <div class="card tbl"><table><thead><tr><th>利確</th><th>損切</th><th class="num">最長</th><th class="num">年率換算</th><th class="num hide-sm">プラスの年</th><th class="num">勝率</th><th class="num hide-sm">平均保有</th><th class="num hide-sm">危機時</th></tr></thead><tbody>` +
        P.top.map(t => { const cur = JSON.stringify(t.plan) === JSON.stringify(P.incumbent);
          return `<tr${cur ? ' style="font-weight:700"' : ""}><td>+${t.plan.tp_atr}ATR</td><td>−${t.plan.sl_atr}ATR</td><td class="num">${t.plan.horizon_days}日</td>
          <td class="num ${cls(t.median)}">${pct(t.median)}</td><td class="num hide-sm">${pct0(t.pos)}</td><td class="num">${pct0(t.win)}</td><td class="num hide-sm">${(t.days || 0).toFixed(1)}日</td><td class="num hide-sm ${cls(t.crisis)}">${pct(t.crisis)}</td></tr>`; }).join("") +
        `</tbody></table></div><p class="small muted">上位12通りを表示。</p>`;
      if (P.per_strategy && P.per_strategy.length) {
        const pls = p => `+${p.tp_atr}／−${p.sl_atr}ATR・${p.horizon_days}日`;
        h += `<h2>戦略ごとの売買ルール</h2><p class="small muted" style="margin-top:0">戦略によって値動きの続き方が違うため（例: 決算後の上昇は数週間続きやすい）、戦略ごとにも同じ安全装置でルールを探しています。</p>
          <div class="card tbl"><table><thead><tr><th>戦略</th><th>現在</th><th class="num">年率換算</th><th class="hide-sm">最有力候補</th><th class="num hide-sm">年率換算</th><th>結果</th></tr></thead><tbody>` +
          P.per_strategy.map(r => `<tr><td><b>${esc(r.name)}</b></td><td class="small">${pls(r.incumbent)}</td><td class="num ${cls(r.inc_score)}">${pct(r.inc_score)}</td>
            <td class="small hide-sm">${r.candidate ? pls(r.candidate) : "-"}</td><td class="num hide-sm ${cls(r.cand_score)}">${pct(r.cand_score)}</td>
            <td class="small" style="white-space:normal;min-width:12em">${r.adopted ? "✅ " : ""}${esc(r.reason)}</td></tr>`).join("") + `</tbody></table></div>`;
      }
    }
    if (R.eras && R.eras.length) {
      const eras = [...new Set(R.eras.map(e => e.era))];
      const cell = (k, era, rg) => { const e = R.eras.find(x => x.strategy === k && x.era === era && x.regime === rg); return e ? `<span class="${cls(e.net)}">${pct(e.net, 2)}</span>` : "-"; };
      h += `<h2>時代ごとの戦略の成績（平常時 ／ <span class="up">危機局面</span>）</h2><div class="card tbl"><table><thead><tr><th>戦略</th>${eras.map(e => `<th class="num" style="white-space:normal;min-width:7em">${esc(e)}</th>`).join("")}</tr></thead><tbody>` +
        [...new Set(R.eras.map(e => e.strategy))].map(k => `<tr><td><b>${esc(stratName(k))}</b></td>${eras.map(era => `<td class="num">${cell(k, era, "平常時")}<div class="small">${cell(k, era, "危機局面")}</div></td>`).join("")}</tr>`).join("") +
        `</tbody></table></div>`;
    }
  }
  const DS = DATA.data_sources;
  if (DS) h += `<h2>使っているデータ</h2><div class="card tbl"><table><tbody>
    <tr><td><b>株価</b></td><td class="small" style="white-space:normal">Yahoo Finance・2002年〜・全上場銘柄の日足</td></tr>
    <tr><td><b>決算</b></td><td class="small" style="white-space:normal">${DS.earnings ? `Yahoo Finance・${DS.earnings.codes.toLocaleString()}銘柄・${DS.earnings.events.toLocaleString()}回分（${esc(DS.earnings.since.slice(0, 4))}年〜）。アナリスト予想がある銘柄のみ。発表日の翌営業日から使用` : "取得中"}</td></tr>
    <tr><td><b>適時開示</b></td><td class="small" style="white-space:normal">${DS.tdnet ? `TDnet（有志の無料API）・${esc(DS.tdnet.since.slice(0, 4))}年〜・${DS.tdnet.rows.toLocaleString()}件（決算短信 ${(DS.tdnet.counts.earnings || 0).toLocaleString()}・自社株買い ${(DS.tdnet.counts.buyback || 0).toLocaleString()}・上方修正 ${(DS.tdnet.counts.forecast_up || 0).toLocaleString()} など）。全銘柄の決算日の補完と、イベント後の値動きに使用` : "取得中"}</td></tr>
    <tr><td><b>配当</b></td><td class="small" style="white-space:normal">Yahoo Finance・2002年〜・全銘柄。配当利回り・増配率・次の権利落ち日（1年前の暦の上で推定）。売買成績に受け取り配当は含めていません（保守的）</td></tr>
    <tr><td><b>信用残</b></td><td class="small" style="white-space:normal">JPX 日々の銘柄別信用取引残高・<b>${DS.flows.margin_days}日分を蓄積</b>。JPXには直近数日分しか無いため毎日集めて貯めています。約250日分たまったらAIの検証に加えます（それまでは候補の参考表示のみ）</td></tr>
    <tr><td><b>空売り残高</b></td><td class="small" style="white-space:normal">JPX 空売り残高報告（0.5%以上の大口）・<b>${DS.flows.short_files}日分を蓄積</b>。同上</td></tr>
  </tbody></table></div>`;
  h += `<h2>考慮している世の中の出来事</h2><div class="card pad"><ul class="timeline">` +
    DATA.events.slice().sort((a, b) => a.start < b.start ? 1 : -1).map(e => `<li><span class="small ${e.kind === "crisis" ? "up" : "muted"}">${e.start.slice(0, 7).replace("-", "/")}<br>${e.kind === "crisis" ? "危機（特例）" : "制度・前提の変化"}</span>
      <span><b>${esc(e.name)}</b><div class="muted small">${esc(e.note)}</div></span></li>`).join("") +
    `</ul><p class="small muted">これに加えて、日経平均の変動率や下落率から「平常時と違う相場」を自動で検知し、未知の急変も特例として扱います。</p></div>`;
  h += `<h2>モデルの世代交代</h2><div class="card tbl"><table><thead><tr><th>バージョン</th><th class="num">学習件数</th><th class="num">上位勝率</th><th class="num">上位期待値</th><th></th></tr></thead><tbody>` +
    DATA.models.map(x => `<tr><td>${esc(x.version)}</td><td class="num">${(x.n_train || 0).toLocaleString()}</td><td class="num">${pct0(x.metrics.daily_top_win)}</td>
      <td class="num ${cls(x.metrics.daily_top_ret)}">${pct(x.metrics.daily_top_ret, 2)}</td><td>${x.active ? '<span class="pill mood-強気">現役</span>' : ""}</td></tr>`).join("") + `</tbody></table></div>`;
  el.innerHTML = h;
}

// ---------------------------------------------------------------- tabs / theme
function show(tab) {
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  document.querySelectorAll("main section").forEach(s => s.hidden = s.id !== tab);
  try { history.replaceState(null, "", "#" + tab); } catch (e) {}
}
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => show(b.dataset.tab)));
$("#theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", document.documentElement.dataset.theme); } catch (e) {}
});
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$("#gen").textContent = "更新 " + DATA.generated.slice(5).replace("-", "/");
renderToday(); renderHistory(); renderPaper(); renderAI();
const fromHash = () => { const h = location.hash.slice(1); if (["today", "history", "paper", "ai"].includes(h)) show(h); };
addEventListener("hashchange", fromHash); fromHash();
</script>
</body>
