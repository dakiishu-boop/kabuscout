# 影の候補（事前登録）: 本番の判断には使わず、本番と同じ日の全候補に点を付けて記録するだけ（kabuscout/shadow.py）。
# このファイルの git の記録（コミットの日時）が事前登録の証拠。前向きの結果を見てから、候補・判定日・基準を変えない。
# 2026-10-28 夜: 結果が1件も出ていない段階で、集計を「全候補の結果が出揃った日だけ」に直し、それに合わせて説明の週数を直した（候補・判定日・基準は同じ）。
# 過去のデータ（2016〜2026年）では方向は良いが決着しなかった（研究ループの基準 t≥2.5 に届かない）候補を、前向きに同じ日どうしで比べる。
registered: 2026-10-28
start: 2026-10-29          # この日のデータ日付から記録する（影のモデルは毎日の実行の後に別の仕事で学習するので、点が付くのは学習の翌日から）
judge:
  date: 2027-06-30         # 判定日。全候補の結果が出揃うのは最長60営業日（約3ヶ月）後なので、4月初めまでの予測（約22週）が判定に入る
  metric: "上位10%の上乗せの差: その日の全候補で、影の点の上位10%の平均リターン − 本番の ai_score の上位10%の平均リターン（実際の売買ルール・コスト前）を週ごとに平均。t は Newey-West（4週）"
  min_weeks: 20            # 全候補の結果が出揃った週がこれ未満なら判定しない
  t_min: 2.0               # 合格: 上乗せの差の t ≥ 2.0
  after: "合格しても自動では昇格しない（人が判断して本番の設定を変える）。不合格なら記録をやめる"
  power: >-
    過去の検証（種0、563週）での差は 葉31 +0.05%（t=1.6）、専門モデル +0.06%（t=2.7）と小さい。
    前向きの約22週で t=2 に届くのは、差が約 +0.3% 以上あるときだけ（週ごとの差のばらつき 約0.7%）。過去どおりの小さな差なら不合格になるのがふつうで、
    不合格は「害がある」ではなく「前向きで大きな差は見えなかった」という意味。
    順位相関の差は参考として記録する（過去では 葉31 −0.004・t=−3.8、専門モデル −0.0005・t=−1.0。売買に使う上位の差とは向きが違う）
variants:                  # 2個に絞る（売買代金5,000万円以上は候補の母集団が変わり、同じ候補での比較にならないので入れない）
  - key: leaf31
    label: 葉31・最小100件
    why: "ジャーナル 40・52: 4つの種で平均 +12.8% vs +10.7% だが t=1.38、研究ループでも t=1.55 < 2.69。最大下落が深い種あり"
    model_params: {learning_rate: 0.05, max_iter: 300, max_leaf_nodes: 31, min_samples_leaf: 100, l2_regularization: 1.0}
  - key: spec_earn
    label: 決算好反応の専門モデル
    why: "ジャーナル 50・52: 2016〜2026年は年率・最大下落・最悪の年がすべて改善したが、研究ループでは t=0.70〜0.88 で不採用"
    specialists: [earnings_drift]

# 研究ループが合格させたAIの変更（モデル設定・特徴量・専門モデル）は、本番に入れる前にこの基準で影として走らせる
research_rule:
  weeks: 12                # 登録の翌営業日から12週後が判定日
  min_weeks: 8
  t_floor: -1.0            # 上乗せの差の t が −1.0 以下（本番よりはっきり悪い）なら見送り、それ以外は本番に昇格

# 口座全体のルールの比較（同じ候補への点の付け方ではないので影では測れない。2つ目のペーパートレード口座を本番と並べる。kabuscout/paper.py）
# 2026-10-30 に登録。結果は1件も出ていない（口座はこの後の最初の実行で、本番の口座のその時点の状態を写して始まる）
accounts:
  - key: paper_swap
    label: 決算好反応の入れ替え
    registered: 2026-10-30
    start: 2026-10-29          # このデータ日付の実行から（本番の口座の状態を写して始める）
    rule: >-
      決算好反応の候補が、その日のAIの上位2件（本番と同じ絞り込みの後）に入り、5枠が埋まっていて見送りになる日は、
      注文した時の点（final_score）が一番低い保有を翌営業日の寄付で売り、その候補を買う。1日1件まで・危機局面では行わない・
      入れ替えても株数が決まらないなら売らない。売買コストは本番と同じ
    why: >-
      ジャーナル 64: 枠の満杯で見送った決算好反応の上位候補は年約84件・平均 +2.06%（買えた分 +2.38%、他の候補は +0.1〜0.2%）。
      過去の検証（4つの種、2016〜2026年）で年率 +12.1% → +15.2%、税引き後 +9.7% → +12.2%、最大下落 −20.8% → −21.2%（種によって ±4ポイント）、
      11年中9年で上回り t=2.50（種1つずつでは t=0.8〜1.3）
    judge:
      date: 2028-10-31
      metric: "同じ期間の、比較用の口座と本番の口座の年率・最大下落。補助: 入れ替え1件ごとの「入れた候補の手取り − 売った保有の残りの値動き」の平均"
      pass: "年率が本番以上で、かつ最大下落が本番より5ポイント以上深くない"
      after: "合格しても自動では本番に入れない（人が判断して本番の設定を変える）。不合格なら記録をやめる"
      power: >-
        過去の検証では、口座1つどうしの週ごとの差は平均 +0.08%・標準偏差 1.3% で、2年（約104週）での t の見込みは約0.65。
        入れ替え1件ごとの差も標準偏差 13% と大きく、t=2 には約530件（約16年）かかる。2年の判定は統計的な決着ではなく、
        「はっきり悪くないか」と、入れ替えの件数・約定が過去の検証どおりか（年約33回）の確認
  # 2026-11-10 に登録。結果は1件も出ていない（口座はこの後の最初の実行で、本番の口座のその時点の状態を写して始まる）
  - key: paper_conf
    label: 自信で買う量を変える
    registered: 2026-11-10
    start: 2026-11-10          # このデータ日付以降の最初の実行から（本番の口座の状態を写して始める）
    size_by_agreement: [[0.95, 2.0]]   # [合意の下限, 倍率]。実際の計算はこの値を読む（kabuscout/pipeline.py → paper.step の sizing）
    rule: >-
      候補・順番・絞り込み・持つ数（5銘柄）・売り方は本番と同じ。買う量だけを変える:
      3つのモデルの合意が 0.95 以上の候補は 2倍（「1銘柄は資金の20%まで」と「損切時の損失は資金の2%まで」の両方に掛ける＝40%・4%）。
      0.95 未満は本番と同じ（1倍）。倍率は注文した時に決めて記録し、翌朝の約定でも同じ倍率を使う。売買コストは本番と同じ
    why: >-
      ジャーナル 82・83（ユーザーの発案）: AIの上位5のうち合意 0.95以上は1回平均 +2.69%・0.8未満は +0.46%（2019年〜）。
      過去の検証（ほぼ同じAI 8種類 × 種2つ = 16通り、2008〜2026年）で 年率 +12.0% → +15.4%、最大下落 −26.9% → −26.8%、シャープ 0.89 → 0.96（14/16で上昇）、
      年ごとの差 +3.4ポイント（t=3.67、19年中17年、年率が上がったのは 16/16）。手仕舞いの違うAI 10通りでも 10/10 で年率・シャープが上昇。
      同じ頻度の倍率を合意と無関係に割り当てた偽薬（10回）は 年率 +0.7ポイント・最大下落 −2.2ポイント・シャープ −0.03 ＝ 上乗せ +3.4 のうち約 +0.7 は「多く買った分」、
      約 +2.7（年ごと t=3.65、19年中16年）が合意の分。今の本番のAIの種ごとの t は 3.11・2.87。
      最初の案（0.9以上も1.25倍）は、偽薬と比べると 0.9〜0.95 の段がほぼ「多く買った分」だけだったので外した。
      倍率は 1.5倍（+2.0ポイント・偽薬との差 t=2.00）と 2倍の結果を両方見たうえで、ユーザーが 2倍を選んだ（2026-11-10。前向きの結果は1件も出ていない）。
      弱いところ: 2008〜2013年は −0.1ポイント（6年中4年がプラスだが2008年が −5.3）／約35通りの買い方を試した中の1つ／
      2022年・2023年に始めた場合はシャープが上がる口座が 7/16・2/16 に減る／1銘柄に資金の40%／1回の取引の最大の損（資金比）が −3.9% → −5.7%
    judge:
      date: 2028-10-31
      metric: "同じ期間の、比較用の口座と本番の口座の年率・最大下落。補助: 2倍で買った注文と1倍の注文の、1回平均の手取りの差"
      pass: "年率が本番以上で、かつ最大下落が本番より5ポイント以上深くない"
      after: "合格しても自動では本番に入れない（人が判断して本番の設定を変える）。不合格なら記録をやめる"
      power: >-
        過去の検証では、この口座と本番の口座の週ごとの差は平均 +0.07〜0.10%・標準偏差 0.9〜1.2% で、2年（約103週）での t の見込みは 0.7〜0.9。
        過去どおりの効果があれば2年の窓で合格の条件を満たすのは 74〜86%、効果が無く多く買っただけ（偽薬）でも 57%。2倍で買う注文は年約14回。
        2年の判定は統計的な決着ではなく、「はっきり悪くないか」と、2倍の注文の数・約定が過去の検証どおりかの確認
  # 2026-11-14 に登録。結果は1件も出ていない。業績修正の題名の過去分（2010年〜）を取り終え、比較用のAIを学習した後の最初の実行から
  # （本番の口座のその時点の状態を写して始まる。取り終えるまでは通知に「準備中」と出る）
  - key: paper_rev
    label: 修正好反応を足したAI
    registered: 2026-11-14
    start: 2026-11-14          # このデータ日付以降で、比較用のAI（data/models/revnet.joblib）ができた後の最初の実行から
    rule: >-
      本番の網に「修正好反応」を1つ足す（kabuscout/revnet.py。業績予想の修正・予想と実績の差異〔訂正を除く〕が終値に入った日から5営業日以内、
      その日が日経平均比 +5%以上・出来高が直前20日平均の1.5倍以上。条件は固定で、研究ループでは調整しない）。
      AIは本番と同じ作り方で、印 s_rev_drift を1つ足して別に学習し（本番と同じ5営業日ごと）、その点の順で、本番と同じ絞り込み・持つ数・
      売り方で買う。修正好反応の候補の売買ルールは決算好反応と同じ。当日の場中・前の営業日の夕方の修正は、スクリーニングの前に一覧を取って使う。
      除外する銘柄（監理・整理・上場廃止予定・買収の発表）と売買コストは本番と同じ
    why: >-
      ジャーナル 84（ユーザーの案）: 網そのもの（AIなし・コスト込み、2011年〜）は 30,847件・1回 +1.12%（t=2.49）、
      開示の無い日の同じ形（対照）は −0.11% ＝ 効いているのは修正の中身。2011〜2018年 +1.55%・2019年〜 +0.88% と両方プラス（後半は小さい）。
      AIの上位2に入った修正好反応は1回 +2.07%／+2.59%（種0／種1、約1,100件）、決算好反応の数はほぼ減らず、上位2の1回平均は +0.68→+0.79%／+0.78→+0.85%。
      ただし口座は年率 +14.6%/+9.2% → +11.8%/+16.1%、年ごとの差 +2.4%/年（t=1.22）で、種0 −2.6%・種1 +7.3% と割れた（採用の目安 t≥2.5 に届かない）。
      弱いところ: 印を1つ足しただけで上位2の約44%が入れ替わる（AIの並びが大きく動く）／最大下落が深くなった種がある（−23.9% → −29.7%）／後半ほど網の手取りが小さい
    judge:
      date: 2028-10-31
      metric: "同じ期間の、比較用の口座と本番の口座の年率・最大下落。補助: 本番に無い注文（同じ日・同じ銘柄が本番に無いもの）の1回平均の手取り"
      pass: "年率が本番以上で、かつ最大下落が本番より5ポイント以上深くない"
      after: "合格しても自動では本番に入れない（人が判断して本番の設定を変える）。不合格なら記録をやめる"
      power: >-
        過去の検証では年ごとの差の標準偏差が約8ポイントで、2年での t の見込みは約0.4。2年の判定は統計的な決着ではなく、
        「はっきり悪くないか」と、修正好反応の注文の数・1回の手取りが過去の検証（上位2で1回 +2%台）から大きく外れないかの確認
