# 影の候補（事前登録）: 本番の判断には使わず、本番と同じ日の全候補に点を付けて記録するだけ（kabuscout/shadow.py）。
# このファイルの git の記録（コミットの日時）が事前登録の証拠。前向きの結果を見てから、候補・判定日・基準を変えない。
# 2026-10-28 夜: 結果が1件も出ていない段階で、集計を「全候補の結果が出揃った日だけ」に直し、それに合わせて説明の週数を直した（候補・判定日・基準は同じ）。
# 過去のデータ（2016〜2026年）では方向は良いが決着しなかった（研究ループの基準 t≥2.5 に届かない）候補を、前向きに同じ日どうしで比べる。
registered: 2026-10-28
start: 2026-10-29          # この日のデータ日付から記録する（影のモデルは毎日の実行の後に別の仕事で学習するので、点が付くのは学習の翌日から）
judge:
  date: 2027-06-30         # 判定日。全候補の結果が出揃うのは最長60営業日（約3ヶ月）後なので、4月初めまでの予測（約22週）が判定に入る
  metric: "上位10%の上乗せの差: その日の全候補で、影の点の上位10%の平均リターン − 本番の ai_score の上位10%の平均リターン（実際の売買ルール・コスト前）を週ごとに平均。t は Newey-West（4週）"
  min_weeks: 20            # 全候補の結果が出揃った週がこれ未満なら判定しない
  t_min: 2.0               # 合格: 上乗せの差の t ≥ 2.0
  after: "合格しても自動では昇格しない（人が判断して本番の設定を変える）。不合格なら記録をやめる"
  power: >-
    過去の検証（種0、563週）での差は 葉31 +0.05%（t=1.6）、専門モデル +0.06%（t=2.7）と小さい。
    前向きの約22週で t=2 に届くのは、差が約 +0.3% 以上あるときだけ（週ごとの差のばらつき 約0.7%）。過去どおりの小さな差なら不合格になるのがふつうで、
    不合格は「害がある」ではなく「前向きで大きな差は見えなかった」という意味。
    順位相関の差は参考として記録する（過去では 葉31 −0.004・t=−3.8、専門モデル −0.0005・t=−1.0。売買に使う上位の差とは向きが違う）
variants:                  # 2個に絞る（売買代金5,000万円以上は候補の母集団が変わり、同じ候補での比較にならないので入れない）
  - key: leaf31
    label: 葉31・最小100件
    why: "ジャーナル 40・52: 4つの種で平均 +12.8% vs +10.7% だが t=1.38、研究ループでも t=1.55 < 2.69。最大下落が深い種あり"
    model_params: {learning_rate: 0.05, max_iter: 300, max_leaf_nodes: 31, min_samples_leaf: 100, l2_regularization: 1.0}
  - key: spec_earn
    label: 決算好反応の専門モデル
    why: "ジャーナル 50・52: 2016〜2026年は年率・最大下落・最悪の年がすべて改善したが、研究ループでは t=0.70〜0.88 で不採用"
    specialists: [earnings_drift]

# 研究ループが合格させたAIの変更（モデル設定・特徴量・専門モデル）は、本番に入れる前にこの基準で影として走らせる
research_rule:
  weeks: 12                # 登録の翌営業日から12週後が判定日
  min_weeks: 8
  t_floor: -1.0            # 上乗せの差の t が −1.0 以下（本番よりはっきり悪い）なら見送り、それ以外は本番に昇格

# 口座全体のルールの比較（同じ候補への点の付け方ではないので影では測れない。2つ目のペーパートレード口座を本番と並べる。kabuscout/paper.py）
# 2026-10-30 に登録。結果は1件も出ていない（口座はこの後の最初の実行で、本番の口座のその時点の状態を写して始まる）
accounts:
  - key: paper_swap
    label: 決算好反応の入れ替え
    registered: 2026-10-30
    start: 2026-10-29          # このデータ日付の実行から（本番の口座の状態を写して始める）
    rule: >-
      決算好反応の候補が、その日のAIの上位2件（本番と同じ絞り込みの後）に入り、5枠が埋まっていて見送りになる日は、
      注文した時の点（final_score）が一番低い保有を翌営業日の寄付で売り、その候補を買う。1日1件まで・危機局面では行わない・
      入れ替えても株数が決まらないなら売らない。売買コストは本番と同じ
    why: >-
      ジャーナル 64: 枠の満杯で見送った決算好反応の上位候補は年約84件・平均 +2.06%（買えた分 +2.38%、他の候補は +0.1〜0.2%）。
      過去の検証（4つの種、2016〜2026年）で年率 +12.1% → +15.2%、税引き後 +9.7% → +12.2%、最大下落 −20.8% → −21.2%（種によって ±4ポイント）、
      11年中9年で上回り t=2.50（種1つずつでは t=0.8〜1.3）
    judge:
      date: 2028-10-31
      metric: "同じ期間の、比較用の口座と本番の口座の年率・最大下落。補助: 入れ替え1件ごとの「入れた候補の手取り − 売った保有の残りの値動き」の平均"
      pass: "年率が本番以上で、かつ最大下落が本番より5ポイント以上深くない"
      after: "合格しても自動では本番に入れない（人が判断して本番の設定を変える）。不合格なら記録をやめる"
      power: >-
        過去の検証では、口座1つどうしの週ごとの差は平均 +0.08%・標準偏差 1.3% で、2年（約104週）での t の見込みは約0.65。
        入れ替え1件ごとの差も標準偏差 13% と大きく、t=2 には約530件（約16年）かかる。2年の判定は統計的な決着ではなく、
        「はっきり悪くないか」と、入れ替えの件数・約定が過去の検証どおりか（年約33回）の確認
